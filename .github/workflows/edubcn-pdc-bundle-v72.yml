name: V72 EDUBCN historic public JS and API routes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/edubcn_pdc_bundle_routes_v72.py
      - .github/workflows/edubcn-pdc-bundle-v72.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public archive reader
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verify syntax
        run: python -m py_compile src/edubcn_pdc_bundle_routes_v72.py
      - name: Compare JS metadata for January HTML resources
        run: python src/edubcn_pdc_bundle_routes_v72.py --output exports_padicat/EDUBCN_V72_ARCHIVED_JS_PUBLIC_API_ROUTES.json
      - name: Publish metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V72_ARCHIVED_JS_PUBLIC_API_ROUTES.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V72 check January archived EDUBCN public app JS routes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
