name: V67 Common Crawl precise PDF filename prefixes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/commoncrawl_precise_filenames_v67.py
      - .github/workflows/commoncrawl-precise-filenames-v67.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive client
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verify syntax
        run: python -m py_compile src/commoncrawl_precise_filenames_v67.py
      - name: Run narrow official filename prefix checks
        run: python src/commoncrawl_precise_filenames_v67.py --output exports_commoncrawl/COMMONCRAWL_V67_SSTT_PRECISE_PDF_PREFIXES.json
      - name: Publish archival index results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_commoncrawl/COMMONCRAWL_V67_SSTT_PRECISE_PDF_PREFIXES.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V67 tight Common Crawl PDF filename prefix search'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
