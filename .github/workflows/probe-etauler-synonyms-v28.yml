name: e-TAULER sinònims docents — historics V28

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/probe_etauler_synonyms_v28.py'
      - '.github/workflows/probe-etauler-synonyms-v28.yml'

permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Check 15 historical teaching-vacancy search terms
        run: python src/probe_etauler_synonyms_v28.py --output exports_etauler/ETAULER_V28_TERMINOLOGIA.json
      - name: Publish non-personal search statistics
        if: always()
        run: |
          if [ ! -s exports_etauler/ETAULER_V28_TERMINOLOGIA.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_etauler/ETAULER_V28_TERMINOLOGIA.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: extended historical teaching edict search terms'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
