name: e-Tauler 2025/26 docent candidate audit V30
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/inspect_etauler_2025_candidates_v30.py', '.github/workflows/inspect-etauler-v30.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Verify three dated public edicts, suppress all personal content
        run: python src/inspect_etauler_2025_candidates_v30.py --output exports_etauler/ETAULER_V30_CANDIDATES.json
      - name: Publish sanitized eligibility flags
        if: always()
        run: |
          if [ ! -s exports_etauler/ETAULER_V30_CANDIDATES.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_etauler/ETAULER_V30_CANDIDATES.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: verify three historical personal-docent edicts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
