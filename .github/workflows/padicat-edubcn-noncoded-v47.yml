name: PADICAT EDUBCN — PDFs sense codi al nom V47
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/padicat_edubcn_noncoded_pdfs_v47.py','.github/workflows/padicat-edubcn-noncoded-v47.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Inspect historic PDF binaries without codes in their names
        run: python src/padicat_edubcn_noncoded_pdfs_v47.py --output exports_padicat/EDUBCN_PADICAT_V47_NONCODED_PDFS.json
      - name: Publish source evidence flags without candidates personal details
        if: always()
        run: |
          if [ ! -s exports_padicat/EDUBCN_PADICAT_V47_NONCODED_PDFS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_PADICAT_V47_NONCODED_PDFS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: identify hidden IT specialties in non-GENSEC historic offer PDFs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
