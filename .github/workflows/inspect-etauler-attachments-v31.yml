name: e-Tauler verify 2025/26 attached PDFs V31
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/inspect_etauler_attachments_v31.py', '.github/workflows/inspect-etauler-attachments-v31.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and in-memory PDF parser
        run: |
          python -m pip install 'playwright>=1.50,<2' 'pymupdf>=1.24,<2'
          python -m playwright install --with-deps chromium
      - name: Validate three public dated edict attachments without personal-data retention
        run: python src/inspect_etauler_attachments_v31.py --output exports_etauler/ETAULER_V31_ATTACHED_PDFS.json
      - name: Publish metadata-only PDF eligibility audit
        if: always()
        run: |
          if [ ! -s exports_etauler/ETAULER_V31_ATTACHED_PDFS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_etauler/ETAULER_V31_ATTACHED_PDFS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: check historical public e-Tauler edict PDF keyword eligibility'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
