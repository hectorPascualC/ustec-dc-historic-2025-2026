name: V62 Common Crawl — 11 dated BCO PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/commoncrawl_dated_bco_v62.py
      - .github/workflows/commoncrawl-dated-bco-v62.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'warcio>=1.7,<3' 'pymupdf>=1.24,<2'
      - name: Check scanner syntax
        run: python -m py_compile src/commoncrawl_dated_bco_v62.py
      - name: Query historically named official PDF URLs
        run: python src/commoncrawl_dated_bco_v62.py --output exports_commoncrawl/COMMONCRAWL_V62_BCO_DATED_PDFS.json
      - name: Commit anonymized index and PDF hash evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_commoncrawl/COMMONCRAWL_V62_BCO_DATED_PDFS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V62 bounded Common Crawl dated PDF archival probes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
