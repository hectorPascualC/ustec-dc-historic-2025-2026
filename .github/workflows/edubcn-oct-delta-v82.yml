name: V82 EDUBCN Jan-Oct archive full PDF delta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/edubcn_archive_oct_delta_full_v82.py
      - .github/workflows/edubcn-oct-delta-v82.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified PDF dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Validate script
        run: python -m py_compile src/edubcn_archive_oct_delta_full_v82.py
      - name: Enumerate Jan and Oct PADICAT PDF inventories; inspect every new or changed original
        run: python src/edubcn_archive_oct_delta_full_v82.py --output exports_padicat/EDUBCN_V82_FULL_OCT_DELTA_2025_26.json
      - name: Publish anonymized archive audit and hashes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V82_FULL_OCT_DELTA_2025_26.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V82 full new or updated PADICAT Oct EDUBCN PDFs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
