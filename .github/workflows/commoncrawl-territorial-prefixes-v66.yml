name: V66 Common Crawl territorial directory prefixes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/commoncrawl_territorial_prefixes_v66.py
      - .github/workflows/commoncrawl-territorial-prefixes-v66.yml
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public archive reader
        run: python -m pip install 'requests>=2.31,<3'
      - name: Validate source
        run: python -m py_compile src/commoncrawl_territorial_prefixes_v66.py
      - name: Query verified public territorial directory prefixes
        run: python src/commoncrawl_territorial_prefixes_v66.py --output exports_commoncrawl/COMMONCRAWL_V66_TERRITORIAL_PREFIXES.json
      - name: Publish anonymized index observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_commoncrawl/COMMONCRAWL_V66_TERRITORIAL_PREFIXES.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V66 Common Crawl territorial and PFI/SPD directory prefix checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
