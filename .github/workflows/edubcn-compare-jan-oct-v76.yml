name: V76 EDUBCN PADICAT January versus October API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/edubcn_compare_jan_oct_api_v76.py
      - .github/workflows/edubcn-compare-jan-oct-v76.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded HTTP reader
        run: python -m pip install 'requests>=2.31,<3'
      - name: Validate source
        run: python -m py_compile src/edubcn_compare_jan_oct_api_v76.py
      - name: Compare two independent authentic archived API JSON snapshots
        run: python src/edubcn_compare_jan_oct_api_v76.py --output exports_padicat/EDUBCN_V76_JAN_OCT_2026_TARGET_DIFF.json
      - name: Commit public vacancy metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V76_JAN_OCT_2026_TARGET_DIFF.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V76 compare actual PADICAT Jan and Oct EDUBCN API snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
