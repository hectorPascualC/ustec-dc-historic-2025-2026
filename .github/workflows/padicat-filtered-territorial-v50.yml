name: PADICAT filtre URL SSTT 2025-26 V50
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/padicat_filtered_territorial_v50.py','.github/workflows/padicat-filtered-territorial-v50.yml']
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Test old official host capture index filters with positive controls
        run: python src/padicat_filtered_territorial_v50.py --output exports_padicat/PADICAT_V50_TERRITORIAL_FILTERS.json
      - name: Publish public archived URL summary
        if: always()
        run: |
          if [ ! -s exports_padicat/PADICAT_V50_TERRITORIAL_FILTERS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/PADICAT_V50_TERRITORIAL_FILTERS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: test PADICAT server filters and positive controls for all territorial PDFs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
