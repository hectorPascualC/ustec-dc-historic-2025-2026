name: V70 PADICAT SSTT historical HTML
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/padicat_historical_sstt_html_v70.py
      - .github/workflows/padicat-historical-sstt-html-v70.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public archival HTML tools
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Verify script
        run: python -m py_compile src/padicat_historical_sstt_html_v70.py
      - name: Read genuine PADICAT archive captures of official SSTT HTML pages
        run: python src/padicat_historical_sstt_html_v70.py --output exports_padicat/PADICAT_V70_SSTT_HTML_HISTORIC_LINKS.json
      - name: Publish only safe public archive data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/PADICAT_V70_SSTT_HTML_HISTORIC_LINKS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V70 official HTML archived link check'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
