name: V75 EDUBCN historic PDF metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/edubcn_pdf_metadata_before_reposting_v75.py
      - .github/workflows/edubcn-pdf-metadata-v75.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF inspect dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Verify syntax
        run: python -m py_compile src/edubcn_pdf_metadata_before_reposting_v75.py
      - name: Check original Jan 2026 PDF files and internal creation dates
        run: python src/edubcn_pdf_metadata_before_reposting_v75.py --output exports_padicat/EDUBCN_V75_PDF_ORIGINAL_CREATION_DATES.json
      - name: Commit anonymized PDF metadata and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V75_PDF_ORIGINAL_CREATION_DATES.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V75 four original EDUBCN PDF internal timestamp and archive checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
