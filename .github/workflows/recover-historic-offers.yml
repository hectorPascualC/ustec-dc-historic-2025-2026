name: Arxius oficials DC novembre 2025 - febrer 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-historic-offers.yml'
      - 'src/recover_official_dc.py'

permissions:
  contents: write

concurrency:
  group: official-dc-archives-historic
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the public repository
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document/archive reader libraries
        run: python -m pip install 'requests>=2.31,<3' 'PyMuPDF>=1.24,<2' 'warcio>=1.7,<2'
      - name: Verify archive parsing and publication rules
        run: python src/recover_official_dc.py --test
      - name: Search public historical captures and audit offer evidence
        run: python src/recover_official_dc.py --output recovered_offers --workers 4 --max-downloads 35
      - name: Publish only public-archive metadata and audit (never personal names)
        if: always()
        shell: bash
        run: |
          if [[ ! -f recovered_offers/AUDITORIA_ARCHIUS_DC.json ]]; then
            echo 'No audit file created; no export.'
            exit 1
          fi
          mkdir -p exports_official
          cp recovered_offers/*.csv recovered_offers/AUDITORIA_ARCHIUS_DC.json exports_official/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_official/
          if ! git diff --cached --quiet; then
            git commit -m 'data: audit recovered historical official DC captures'
            git pull --rebase origin main
            git push origin HEAD:main
          fi