name: EDUBCN — auditar PDF originals i resultats V44
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/audit_edubcn_offers_results_v44.py','.github/workflows/audit-edubcn-offers-results-v44.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Audit four historic offers and their available results
        run: python src/audit_edubcn_offers_results_v44.py --output exports_padicat/EDUBCN_V44_OFFERS_RESULTS_PDF.json
      - name: Publish metadata of PDFs without any personal names
        if: always()
        run: |
          if [ ! -s exports_padicat/EDUBCN_V44_OFFERS_RESULTS_PDF.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V44_OFFERS_RESULTS_PDF.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: confirm four historical DC offer PDFs and available result evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
