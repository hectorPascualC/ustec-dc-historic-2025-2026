name: V87 Complete 12 areas and 48 territory-month evidence audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/audit_12_territories_48_months_v87.py
      - .github/workflows/audit-full-12-areas-v87.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile script
        run: python -m py_compile src/audit_12_territories_48_months_v87.py
      - name: Validate all 12 areas, 48 months, V86 SSTT PDF bytes and V73 EDUBCN
        run: |
          python src/audit_12_territories_48_months_v87.py \
            --areas cens/V87_REVISIO_COMPLETA_12_AMBITS.csv \
            --months cens/V87_MATRIU_48_TERRITORI_MES.csv \
            --json exports_territorial/SSTT_V87_AUDITORIA_COMPLETA_12_AMBITS.json
      - name: Commit public anonymized evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cens/V87_REVISIO_COMPLETA_12_AMBITS.csv cens/V87_MATRIU_48_TERRITORI_MES.csv exports_territorial/SSTT_V87_AUDITORIA_COMPLETA_12_AMBITS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V87 all 12 areas and 48 territory-month records reconciled'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
