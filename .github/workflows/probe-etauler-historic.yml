name: e-TAULER arxiu històric Generalitat — controls públics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/probe_etauler_historic.py'
      - '.github/workflows/probe-etauler-historic.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Inspect public historic search metadata without personal records
        run: python src/probe_etauler_historic.py --output exports_etauler/ETAULER_UI_AUDIT.json
      - name: Commit anonymized diagnostic
        if: always()
        run: |
          if [ ! -s exports_etauler/ETAULER_UI_AUDIT.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_etauler/ETAULER_UI_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: e-TAULER public historical search controls'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
