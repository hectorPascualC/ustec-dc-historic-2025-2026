name: EDUBCN 2025-26 — inspeccio tots PDF arxivats V45
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/edubcn_padicat_all_offer_pdfs_v45.py','.github/workflows/edubcn-padicat-all-pdfs-v45.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public PDF forensic reader
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Verify all archived public GENSEC offer PDF documents
        run: python src/edubcn_padicat_all_offer_pdfs_v45.py --output exports_padicat/EDUBCN_PADICAT_V45_ALL_PDFS.json
      - name: Publish sanitized candidate specialty evidence
        if: always()
        run: |
          if [ ! -s exports_padicat/EDUBCN_PADICAT_V45_ALL_PDFS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_PADICAT_V45_ALL_PDFS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: check every 2026-01 archived GENSEC original PDF for IT/PFI codes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
