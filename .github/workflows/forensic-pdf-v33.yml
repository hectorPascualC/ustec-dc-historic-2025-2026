name: Forensica revisions PDF DC V33
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/forensic_pdf_incremental_v33.py'
      - '.github/workflows/forensic-pdf-v33.yml'
permissions:
  contents: write
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF inspection dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Inspect 30 live DC PDF documents for internal historical revisions
        run: python src/forensic_pdf_incremental_v33.py --output exports_forensic/PDF_V33_INCREMENTAL_REVISIONS.json
      - name: Publish sanitized structural audit only
        if: always()
        run: |
          if [ ! -s exports_forensic/PDF_V33_INCREMENTAL_REVISIONS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_forensic/PDF_V33_INCREMENTAL_REVISIONS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: inspect DC PDF incremental revisions without personal data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
