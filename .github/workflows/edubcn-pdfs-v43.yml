name: EDUBCN quatre PDFs i resultats V43
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/edubcn_pdf_result_audit_v43.py','.github/workflows/edubcn-pdfs-v43.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Check original 507/627 offers and historical results
        run: python src/edubcn_pdf_result_audit_v43.py --output exports_padicat/EDUBCN_V43_PDF_RESULTS.json
      - name: Publish anonymized PDF evidence only
        if: always()
        run: |
          if [ ! -s exports_padicat/EDUBCN_V43_PDF_RESULTS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V43_PDF_RESULTS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: EDUBCN historical original PDF and result evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
