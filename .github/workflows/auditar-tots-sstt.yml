name: Auditoria DC tots 11 SSTT i EDUBCN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/auditar_tots_sstt.py'
      - '.github/workflows/auditar-tots-sstt.yml'

permissions:
  contents: write

concurrency:
  group: audit-tots-sstt-2025-2026
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document indexing dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'pymupdf>=1.24,<2'
      - name: Test historical date guards and specialty parsing
        run: python src/auditar_tots_sstt.py --test
      - name: Audit every official territorial source and public linked PDF
        run: python src/auditar_tots_sstt.py --output exports_territorial
      - name: Publish sanitized 12-area audit only
        if: always()
        run: |
          if [ ! -s exports_territorial/AUDITORIA_PASADA_TERRITORIAL.json ]; then
            echo "No audit output to publish"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_territorial/
          if ! git diff --cached --quiet; then
            git commit -m "audit: publish all SSTT public source index and gaps"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
