name: PADICAT carpeta PDFs EDUBCN mesos V44
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/padicat_edubcn_folder_v44.py','.github/workflows/padicat-edubcn-folder-v44.yml']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Index four historic months of original EDUBCN PDF directory
        run: python src/padicat_edubcn_folder_v44.py --output exports_padicat/EDUBCN_V44_MONTHLY_PDF_DIRECTORY.json
      - name: Publish only capture metadata and specialty candidates
        if: always()
        run: |
          if [ ! -s exports_padicat/EDUBCN_V44_MONTHLY_PDF_DIRECTORY.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V44_MONTHLY_PDF_DIRECTORY.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: index monthly 2025-26 EDUBCN archived original PDF directory'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
