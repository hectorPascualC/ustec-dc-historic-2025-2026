name: PADICAT — historial PDF oficials DC V32

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/probe_padicat_historic_v32.py'
      - '.github/workflows/probe-padicat-v32.yml'

permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public browser
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Inspect actual PADICAT search and historical links
        run: python src/probe_padicat_historic_v32.py --output exports_padicat/PADICAT_V32_PUBLIC_INTERFACE.json
      - name: Publish sanitized archival search metadata
        if: always()
        run: |
          if [ ! -s exports_padicat/PADICAT_V32_PUBLIC_INTERFACE.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/PADICAT_V32_PUBLIC_INTERFACE.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: PADICAT original DC PDF web archive discovery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
