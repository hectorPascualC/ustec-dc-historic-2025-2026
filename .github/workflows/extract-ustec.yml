name: Recuperar DC USTEC 2025-2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-ustec.yml'
      - 'src/recuperar_ustec_dc.py'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: ustec-dc-extraction
  cancel-in-progress: false

jobs:
  extract:
    # Standard runner; free GitHub Actions minutes for a PUBLIC repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Offline parser tests
        run: python src/recuperar_ustec_dc.py --test
      - name: Extract historical appointments from USTEC
        run: |
          python src/recuperar_ustec_dc.py \
            --output resultats \
            --course 2025-2026 \
            --start 2025-11-01 --end 2026-02-28 \
            --codes 507 627 F57 F87 \
            --page-size 250 --max-pages 120 --anonymize
      - name: Diagnose procedure and unassigned UI controls (public metadata only)
        if: always()
        run: python src/diagnosticar_ustec.py --output resultats/USTEC_DIAGNOSTIC.json
      - name: Publish anonymized audit and CSV results in this public repository
        if: always()
        run: |
          if [ ! -f resultats/AUDITORIA_EXTRACCIO.json ]; then
            echo "No extraction audit exists; nothing to publish"
            exit 0
          fi
          mkdir -p exports
          cp resultats/AUDITORIA_EXTRACCIO.json exports/
          cp resultats/USTEC_nomenaments_*.csv exports/
          if [ -f resultats/USTEC_DIAGNOSTIC.json ]; then cp resultats/USTEC_DIAGNOSTIC.json exports/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish anonymized USTEC historical extraction"
            git push origin HEAD:main
          fi