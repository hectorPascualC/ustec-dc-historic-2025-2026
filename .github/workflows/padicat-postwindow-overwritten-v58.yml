name: V58 PADICAT post-window overwritten PDF recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/padicat_postwindow_overwritten_pdfs_v58.py
      - .github/workflows/padicat-postwindow-overwritten-v58.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies for archival probe
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Verify scanner syntax
        run: python -m py_compile src/padicat_postwindow_overwritten_pdfs_v58.py
      - name: Execute six official PDF URL captures after requested interval
        run: python src/padicat_postwindow_overwritten_pdfs_v58.py --output exports_padicat/PADICAT_V58_POSTWINDOW_OVERWRITTEN_PDFS.json
      - name: Commit anonymous archive metadata
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/PADICAT_V58_POSTWINDOW_OVERWRITTEN_PDFS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V58 bounded post-window PADICAT official PDF capture query'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
