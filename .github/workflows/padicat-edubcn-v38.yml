name: PADICAT EDUBCN — reproduir captures HTML V38
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/padicat_edubcn_replays_v38.py','.github/workflows/padicat-edubcn-v38.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Validate PADICAT archive capture dates and EDUBCN historical replays
        run: python src/padicat_edubcn_replays_v38.py --output exports_padicat/PADICAT_EDUBCN_V38_REPLAYS.json
      - name: Publish metadata-only verifications
        if: always()
        run: |
          if [ ! -s exports_padicat/PADICAT_EDUBCN_V38_REPLAYS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/PADICAT_EDUBCN_V38_REPLAYS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: verify captured EDUBCN page versions and dates at PADICAT'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
