name: V79 historical EDUBCN original result PDF dates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/edubcn_result_pdf_dates_v79.py
      - .github/workflows/edubcn-result-pdf-dates-v79.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF metadata tools
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Validate source
        run: python -m py_compile src/edubcn_result_pdf_dates_v79.py
      - name: Recheck known official January result notice documents
        run: python src/edubcn_result_pdf_dates_v79.py --output exports_padicat/EDUBCN_V79_RESULT_PDF_DATES.json
      - name: Publish safe metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V79_RESULT_PDF_DATES.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V79 official result PDF creation date and status metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
