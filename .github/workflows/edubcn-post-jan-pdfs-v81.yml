name: V81 post-January EDUBCN PADICAT archived PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/edubcn_post_jan_archived_pdf_index_v81.py
      - .github/workflows/edubcn-post-jan-pdfs-v81.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public archival PDF tools
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Validate V81 script
        run: python -m py_compile src/edubcn_post_jan_archived_pdf_index_v81.py
      - name: Compare February to October archived documents with January corpus
        run: python src/edubcn_post_jan_archived_pdf_index_v81.py --output exports_padicat/EDUBCN_V81_POST_JAN_ARCHIVED_PDFS.json
      - name: Commit anonymized archival proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V81_POST_JAN_ARCHIVED_PDFS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V81 post-Jan EDUBCN archived PDF corpus and 2025-26 target checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
