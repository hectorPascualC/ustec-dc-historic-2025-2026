name: Recuperar JSON EDUBCN 29 gener 2026 V41
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/recover_edubcn_20260129_dc_v41.py','.github/workflows/recover-edubcn-snapshot-v41.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historic API and PDF readers
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Restore January 2026 public JSON and verify matching original offers
        run: python src/recover_edubcn_20260129_dc_v41.py --output exports_padicat/EDUBCN_20260129_V41_TARGET_OFFERS.json
      - name: Publish sanitized vacancy metadata and SHA-256 only
        if: always()
        run: |
          if [ ! -s exports_padicat/EDUBCN_20260129_V41_TARGET_OFFERS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_20260129_V41_TARGET_OFFERS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: recover original 2026-01 EDUBCN DC listings from PADICAT JSON'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
