name: e-Tauler public historic API schema V29
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/probe_etauler_api_v29.py'
      - '.github/workflows/probe-etauler-api-v29.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python src/probe_etauler_api_v29.py --output exports_etauler/ETAULER_API_V29_SCHEMA.json
      - name: Publish only aggregate schema
        if: always()
        run: |
          if [ ! -f exports_etauler/ETAULER_API_V29_SCHEMA.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_etauler/ETAULER_API_V29_SCHEMA.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: verified historic e-Tauler API schema and count metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
