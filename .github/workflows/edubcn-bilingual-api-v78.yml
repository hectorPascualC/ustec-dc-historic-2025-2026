name: V78 historical EDUBCN bilingual API comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/edubcn_bilingual_api_historical_diff_v78.py
      - .github/workflows/edubcn-bilingual-api-v78.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'requests>=2.31,<3'
      - name: Source validation
        run: python -m py_compile src/edubcn_bilingual_api_historical_diff_v78.py
      - name: Verify ca and es archive snapshots at Jan29 and Oct04
        run: python src/edubcn_bilingual_api_historical_diff_v78.py --output exports_padicat/EDUBCN_V78_BILINGUAL_API_HISTORIC_DIFF.json
      - name: Publish public archive audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V78_BILINGUAL_API_HISTORIC_DIFF.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V78 compare bilingual PADICAT snapshots and 2025-26 codes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
