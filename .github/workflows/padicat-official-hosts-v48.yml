name: PADICAT variants hosts oficials SSTT V48
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/padicat_official_host_variants_v48.py','.github/workflows/padicat-official-hosts-v48.yml']
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Check historic official PDF hosts and public archive URL variants
        run: python src/padicat_official_host_variants_v48.py --output exports_padicat/PADICAT_V48_ALT_OFFICIAL_HOSTS.json
      - name: Publish archived public source index only
        if: always()
        run: |
          if [ ! -s exports_padicat/PADICAT_V48_ALT_OFFICIAL_HOSTS.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/PADICAT_V48_ALT_OFFICIAL_HOSTS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: verify alternate official PDF hosts in PADICAT 2025-26'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
