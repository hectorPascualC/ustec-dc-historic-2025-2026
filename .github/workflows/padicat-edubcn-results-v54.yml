name: V54 PADICAT EDUBCN GENSEC result PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/padicat_edubcn_gensec_results_v54.py
      - .github/workflows/padicat-edubcn-results-v54.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - run: python -m py_compile src/padicat_edubcn_gensec_results_v54.py src/padicat_edubcn_remaining_pdfs_v53.py
      - name: Audit all GENSEC result PDFs with privacy-safe extract
        run: python src/padicat_edubcn_gensec_results_v54.py --output exports_padicat/EDUBCN_V54_GENSEC_RESULTS.json
      - name: Publish machine-checkable result counts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V54_GENSEC_RESULTS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V54 cover final archived GENSEC result PDFs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
