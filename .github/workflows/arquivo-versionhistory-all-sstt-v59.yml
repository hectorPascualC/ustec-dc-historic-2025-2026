name: V59 Arquivo.pt historical PDF versions across all SSTT
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/arquivo_version_history_all_sstt_v59.py
      - .github/workflows/arquivo-versionhistory-all-sstt-v59.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public archive tooling
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Compile audit program
        run: python -m py_compile src/arquivo_version_history_all_sstt_v59.py
      - name: Verify all SSTT public PDF URL histories with Arquivo.pt
        run: python src/arquivo_version_history_all_sstt_v59.py --output exports_official/ARQUIVO_PT_V59_ALL_SSTT_PDF_VERSION_HISTORY.json
      - name: Commit anonymous version-history audit
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_official/ARQUIVO_PT_V59_ALL_SSTT_PDF_VERSION_HISTORY.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V59 investigate PDF version history across all SSTT via Arquivo.pt'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
