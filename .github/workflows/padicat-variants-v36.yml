name: PADICAT — variants i prefixos DC V36
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/padicat_variants_prefix_v36.py','.github/workflows/padicat-variants-v36.yml']
permissions:
  contents: write
jobs:
  cdx:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public archive HTTP client
        run: python -m pip install 'requests>=2.31,<3'
      - name: Check exact and prefix archive records across 12 public areas
        run: python src/padicat_variants_prefix_v36.py --output exports_padicat/PADICAT_V36_VARIANTS_PREFIX.json
      - name: Publish metadata-only verified responses
        if: always()
        run: |
          if [ ! -s exports_padicat/PADICAT_V36_VARIANTS_PREFIX.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/PADICAT_V36_VARIANTS_PREFIX.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: PADICAT captures for historic URL variants and territorial prefixes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
