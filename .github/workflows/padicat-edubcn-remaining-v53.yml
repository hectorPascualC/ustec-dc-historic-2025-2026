name: V53 PADICAT EDUBCN remaining archived PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/padicat_edubcn_remaining_pdfs_v53.py
      - .github/workflows/padicat-edubcn-remaining-v53.yml
permissions:
  contents: write
concurrency:
  group: padicat-edubcn-v53
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public PDF processing dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pymupdf>=1.24,<2'
      - name: Validate script
        run: python -m py_compile src/padicat_edubcn_remaining_pdfs_v53.py
      - name: Audit previously excluded filenames, all extractable pages
        run: python src/padicat_edubcn_remaining_pdfs_v53.py --output exports_padicat/EDUBCN_V53_REMAINING_EXCLUDED_PDFS.json
      - name: Commit anonymous audit metadata on default branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports_padicat/EDUBCN_V53_REMAINING_EXCLUDED_PDFS.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: V53 inspect previously excluded EDUBCN archived PDFs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
